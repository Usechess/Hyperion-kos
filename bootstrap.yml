name: HKI Bootstrap System

on:
  push:
    branches: [main]

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bootstrap HKI structure
        run: |
          python scripts/bootstrap.py
